<style>
/* Layout: matchday notice board. Owner jobs (owner only) → this week's result bars → table → race → money → raw scores → admin. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --sunk:#eceef2; --line:#d9dce3; --track:#eceef2;
  --ink:#141821; --ink-2:#4a5160; --ink-3:#5f6676;
  --gold:#8a5f00; --gold-soft:#f6ecd2;
  --fine:#b3261e; --fine-soft:#fbe4e1;
  --ok:#1d7a46; --ok-soft:#dff1e6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --crest:#141821; --crest-ink:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --brand:"Big Shoulders Display","Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#171b23; --sunk:#1f242e; --line:#2c3240; --track:#252b36;
  --ink:#eef0f4; --ink-2:#b5bbc7; --ink-3:#8d94a2;
  --gold:#e3b54a; --gold-soft:#3a2f14;
  --fine:#f2766b; --fine-soft:#3d1c19;
  --ok:#5cc58a; --ok-soft:#173326;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --crest:#eef0f4; --crest-ink:#0f1218; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#171b23; --sunk:#1f242e; --line:#2c3240; --track:#252b36;
  --ink:#eef0f4; --ink-2:#b5bbc7; --ink-3:#8d94a2;
  --gold:#e3b54a; --gold-soft:#3a2f14;
  --fine:#f2766b; --fine-soft:#3d1c19;
  --ok:#5cc58a; --ok-soft:#173326;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --crest:#eef0f4; --crest-ink:#0f1218; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:18px 48px}
#app{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h2{font-family:var(--brand);font-weight:800;font-size:1.7rem;text-transform:uppercase;letter-spacing:.01em}
p{margin:0}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}

/* Masthead */
.mastwrap{display:flex;flex-direction:column;gap:12px}
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.mast h1{font-family:var(--brand);font-weight:900;text-transform:uppercase;line-height:.85;letter-spacing:.005em;display:flex;flex-direction:column}
.mast h1 .w1{font-size:clamp(3.6rem,15vw,6.2rem)}
.mast h1 .w2{font-size:clamp(1.35rem,5.4vw,2.3rem);font-weight:700;letter-spacing:.06em;color:var(--ink-2)}
.gwbadge{display:flex;flex-direction:column;align-items:flex-end;flex:none;text-align:right}
.gwbadge b{font-family:var(--brand);font-size:clamp(2.4rem,9vw,3.8rem);line-height:.85;font-weight:800}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-weight:600;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;width:max-content;white-space:nowrap}
.chip.fine{background:var(--fine-soft);color:var(--fine)}
.chip.ok{background:var(--sunk);color:var(--ink-2)}
.chip.gold{background:var(--sunk);color:var(--ink-2)}
.chip svg{width:13px;height:13px;flex:none}

/* Weekly result */
.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:16px}
.result-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 12px;flex-wrap:wrap}
.result-head h2{font-family:var(--brand);font-weight:800;font-size:clamp(2rem,7vw,2.6rem);text-transform:uppercase;letter-spacing:.01em;line-height:.9}
.status{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;border-radius:999px;padding:2px 10px;border:1.5px solid currentColor}
.status.prov{color:var(--ink-2);border-style:dashed}
.status.final{color:var(--ink-2)}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:2rem minmax(0,1fr) 3.6rem;grid-template-areas:"rk name tot" "rk track tot" "rk split tot";gap:5px 12px;align-items:center}
.bar-row .rk{font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--ink-3);text-align:center;grid-area:rk}
.bar-row .cn{font-weight:600;font-size:1.02rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;grid-area:name}
.bar-row .tt{font-family:var(--brand);font-weight:800;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums;grid-area:tot;text-align:right}
.track{height:12px;border-radius:999px;background:var(--track);overflow:hidden;grid-area:track}
.fill{height:100%;border-radius:999px;background:var(--c)}
.split{grid-area:split;font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:-2px}
.bar-row.low .tt,.bar-row.low .rk{color:var(--fine)}
.spoon{font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fine);border:2px solid var(--fine);border-radius:4px;padding:0 6px;transform:rotate(-4deg);display:inline-block;line-height:1.5}
.crown{font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border-radius:4px;padding:0 6px;line-height:1.5}
.margin{font-size:.92rem;color:var(--ink-2);border-left:3px solid var(--fine);padding-left:10px}
.dues{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:10px}
.due{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.dues .eyebrow+.due{border-top:0}
.due .who{font-weight:600}
.due .why{color:var(--ink-2);font-size:.88rem}
.stripe{display:flex;height:6px;border-radius:999px;overflow:hidden;gap:3px}
.stripe span{flex:1;background:var(--c)}

/* Buttons */
button{font:inherit;cursor:pointer}
.btn{font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;min-height:40px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{font-size:.88rem;padding:4px 12px;min-height:34px}
.btn.danger{background:transparent;color:var(--fine);border-color:var(--fine)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.jump a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* Tables */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);background:var(--sunk)}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td.l{font-weight:600}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle;flex:none}
.pos{font-family:var(--display);font-weight:700;font-size:1.2rem;width:2em}
td.f{color:var(--fine);font-weight:600}
.mark{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;color:var(--fine);margin-left:3px;vertical-align:super}
@media (max-width:560px){.wide-only{display:none}th,td{padding:9px 7px}td.l{white-space:normal;min-width:7.5em}}
.sticky th:first-child,.sticky td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
.sticky th:first-child{background:var(--sunk)}
.swipe{display:none}
@media (max-width:560px){.swipe{display:block}}
td.lowcell{background:var(--fine-soft);color:var(--fine);font-weight:700}

/* Chart */
.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 12px 8px;position:relative}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem;color:var(--ink-2)}
svg.chart{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
svg.chart text{fill:var(--ink-3);font-family:var(--body);font-size:12px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .lbl{font-weight:600;fill:var(--ink)}
svg.chart .cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:.85rem;line-height:1.35;min-width:160px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:2}
.tip b{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}
.tip .row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}

/* Money */
.kitty{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kitty div{background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kitty b{font-family:var(--brand);font-size:1.9rem;font-weight:700;line-height:1}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
summary{cursor:pointer;padding:12px 14px;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
details .tablewrap{border:0;border-top:1px solid var(--line);border-radius:0 0 10px 10px}

/* Owner */
.adminbar{border:2px solid var(--ink);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:.95rem}
.adminlink{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.adminlink code{font-size:.8rem;background:var(--sunk);padding:6px 8px;border-radius:6px;word-break:break-all;min-width:0;flex:1 1 14rem}
.jobs{background:var(--gold-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.jobs h2{font-size:1.3rem}
.job{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--gold) 25%,transparent)}
.job:first-of-type{border-top:0}
.job span{min-width:0}
.paidat{align-items:flex-end}
.paidat label{display:flex;flex-direction:column;font-weight:600;font-size:.95rem}
.paidat input{max-width:15rem}
.jobs .acts{display:flex;flex-wrap:wrap;gap:8px}
.owner-wrap{border:2px dashed var(--line);background:transparent}
.owner-wrap summary{color:var(--ink-2);font-size:.95rem}
.owner{padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.85rem;color:var(--ink-2)}
.check{display:flex;gap:8px;align-items:center;font-size:.95rem}
.check input{width:18px;height:18px;accent-color:var(--ink)}
input[type=number],input[type=datetime-local],input[type=text],select{font:inherit;font-variant-numeric:tabular-nums;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{font-size:.9rem;color:var(--ink-2)}
.msg:empty{display:none}
.rulesec{gap:14px}
.glance{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (min-width:700px){.glance{grid-template-columns:repeat(4,minmax(0,1fr))}}
.glance div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.glance b{font-family:var(--brand);font-weight:800;font-size:1.65rem;line-height:1;letter-spacing:.01em}
.glance span{font-size:.88rem;line-height:1.35;color:var(--ink-2)}
.rulebook{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rs{padding:14px 16px 16px;border-top:1px solid var(--line)}
.rs:first-child{border-top:0}
.rs h3{display:flex;align-items:center;gap:10px;font-size:1.15rem;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em}
.sn{display:inline-grid;place-items:center;width:1.75rem;height:1.75rem;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--brand);font-weight:800;font-size:1rem;flex:none;letter-spacing:0}
.rs ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;color:var(--ink-2)}
.rs ol li{display:grid;grid-template-columns:2.3rem minmax(0,1fr);gap:4px}
.rn{font-family:var(--display);font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
b.em{color:var(--ink)}
.changes{list-style:none;margin:0;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px;font-size:.92rem;color:var(--ink-2)}
.changes ul{margin:6px 0 0;padding-left:1.1rem;display:flex;flex-direction:column;gap:3px}
.adminzone{border:2px solid var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:14px}
.adminzone>h2{font-size:1.5rem}
.adminzone .adminbar{border:0;padding:0}
.adminzone .tools{display:flex;flex-direction:column;gap:10px}
.statusline{font-size:.92rem;color:var(--ink-2);display:flex;gap:9px;align-items:baseline;margin-top:-6px}
.statusline::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--ink-3);flex:none;transform:translateY(-1px);box-sizing:border-box}
.statusline.on::before{border:0;background:var(--ink)}
.statusline a{color:var(--ink);font-weight:600;text-underline-offset:3px}
.statusline b{color:var(--ink);font-weight:600}
.bar-row.lv{grid-template-columns:2rem minmax(0,1fr) 4.4rem;grid-template-areas:"rk name tot" "rk track tot" "split split split"}
.bar-row.lv .split{padding-left:calc(2rem + 12px)}
.togo{display:block;font-family:var(--display);font-weight:600;font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-top:5px;white-space:nowrap}
.lvwrap{list-style:none}
.lvwrap details{border:0;background:none;border-radius:0}
.lvwrap summary{padding:0;font:inherit;letter-spacing:0;text-transform:none;list-style:none;cursor:pointer}
.lvwrap summary::-webkit-details-marker{display:none}
.bar-row.lvc{grid-template-columns:2rem minmax(0,1fr) 4.4rem}
.chev{width:16px;height:16px;color:var(--ink-3);transition:transform .15s}
.lvwrap details[open] .chev{transform:rotate(180deg)}
.lvd{display:flex;flex-direction:column;gap:6px;padding:8px 0 2px calc(2rem + 12px);font-size:.85rem;color:var(--ink-2)}
.pl{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
.pl b{color:var(--ink);font-weight:600}
.pd{flex-basis:100%;color:var(--ink-2)}
.chiptag,.hit{display:inline-block;font-family:var(--display);font-weight:600;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:0 7px;line-height:1.55}
.chiptag{background:var(--sunk);color:var(--ink-2)}
.hit{background:var(--fine-soft);color:var(--fine)}
.trhi{border-left:4px solid var(--ink);background:var(--surface);border-radius:0 10px 10px 0;padding:10px 14px;margin:0;font-size:.92rem;color:var(--ink-2);display:flex;flex-direction:column;gap:4px;list-style:none}
.trgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.trgrid{grid-template-columns:1fr}}
.trcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.trcard h3{font-size:1.05rem;text-transform:uppercase;letter-spacing:.05em}
.trp{display:flex;flex-direction:column;gap:3px;min-width:0}
.trp b{font-weight:600}
.trm{font-size:.9rem;color:var(--ink-2);overflow-wrap:anywhere}
.trm .o{color:var(--ink-3)} .trm .i{color:var(--ink);font-weight:600} .trm .ar{display:inline-block;width:14px;height:14px;vertical-align:-2px;color:var(--ink-3);margin:0 3px}
.trlog{list-style:none;margin:0;padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px;font-size:.9rem;color:var(--ink-2)}
.trlog h4{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.trlog ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:2px}
.trlog details{border:0;background:none;border-radius:0}
.trlog details summary{padding:0;font:inherit;letter-spacing:0;text-transform:none;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
/* Crest, kicker and jump bar */
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.crest{height:clamp(4rem,16vw,6.4rem);width:auto;flex:none;display:block}
.k-n{display:none}
@media (max-width:560px){.k-w{display:none}.k-n{display:inline}#app{gap:22px}}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.jump{position:sticky;top:0;z-index:5;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:-8px -16px -6px;padding:0 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.jump::-webkit-scrollbar{display:none}
@media (min-width:913px){.jump{margin-inline:0;padding-inline:0}}

    if(low.length>1&&hasBench){const bp=p=>+((g.bench||{})[p])||0;const mb=Math.min(...low.map(bp));const kept=low.filter(p=>bp(p)===mb);indivTie=kept.length<low.length;low=kept;}

  const order=[...couples].sort((a,b)=>b.pts-a.pts);
  order.forEach((c,k)=>{c.rank=(k>0&&order[k-1].pts===c.pts)?order[k-1].rank:k+1;});
  const pl=players().map(p=>({p,pts:res.reduce((s,r)=>s+(+r.g.scores[p]||0),0),low:res.filter(r=>r.a.lowInd.includes(p)).length})).sort((x,y)=>y.pts-x.pts);
  pl.forEach((r,k)=>{r.rank=(k>0&&pl[k-1].pts===r.pts)?pl[k-1].rank:k+1;});
  return {res,cum,couples,order,per,outstanding,last:res[res.length-1],live:liveG,pl,extras};
}

/* ---------- chart ---------- */
function nice(r){const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}
const mns=v=>v<0?'−'+(-v):String(v);
function chartSVG(Z){
  const n=Z.res.length; if(!n)return'';
  const cw=(($('#app')||{}).clientWidth||640)-26;
  const W=Math.round(Math.max(320,Math.min(760,cw))),H=Math.round(Math.max(230,Math.min(300,W*0.48))),pl=40,pr=96,pt=14,pb=30;
  const gws=Z.res.map(r=>r.g.gw);
  const data=view==='total'?Z.cum:Z.cum.map(s=>s.map((v,k)=>v-Math.max(...Z.cum.map(x=>x[k]))));
  const flat=data.flat();
  let lo=view==='total'?0:Math.min(-10,...flat), hi=view==='total'?Math.max(...flat):0;
  const step=nice((hi-lo)/4||10); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step; if(hi===lo)hi=lo+step;
  const x=k=>n===1?pl+(W-pl-pr)/2:pl+k*(W-pl-pr)/(n-1);
  const y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${view==='total'?'Running points total':'Points behind the leader'} by gameweek for each couple">`;
  for(let v=lo;v<=hi+1e-9;v+=step)s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${mns(v)}</text>`;
  const every=Math.ceil(n/Math.max(2,Math.floor((W-pl-pr)/44)));
  gws.forEach((gw,k)=>{if(k%every===0||k===n-1)s+=`<text x="${x(k)}" y="${H-8}" text-anchor="middle">GW${gw}</text>`;});
  const ends=data.map((d,i)=>({i,y:y(d[n-1]),v:d[n-1]})).sort((a,b)=>a.y-b.y);
  for(let k=1;k<ends.length;k++)if(ends[k].y-ends[k-1].y<16)ends[k].y=ends[k-1].y+16;
  data.forEach((d,i)=>{
    if(n>1)s+=`<polyline points="${d.map((v,k)=>`${x(k)},${y(v)}`).join(' ')}" fill="none" stroke="${SERIES[i]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s+=`<circle cx="${x(n-1)}" cy="${y(d[n-1])}" r="5" fill="${SERIES[i]}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  ends.forEach(e=>{s+=`<text class="lbl" x="${W-pr+12}" y="${e.y+4}">${esc(S.couples[e.i].players.map(w=>w[0]).join('&'))} · ${mns(e.v)}</text>`;});
  s+=`<line class="cross" id="cross" x1="0" x2="0" y1="${pt}" y2="${H-pb}" visibility="hidden"/><rect id="hit" x="${pl-10}" y="${pt}" width="${W-pl-pr+20}" height="${H-pt-pb}" fill="transparent"/></svg>`;
  chartSVG.meta={W,n,x,data,gws};
  return s;
}
function wireChart(){
  const svg=$('svg.chart'),tip=$('#tip'),hit=$('#hit'),cross=$('#cross'); if(!svg||!hit)return;
  const M=chartSVG.meta;
  const move=ev=>{
    const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)*M.W/r.width;
    let k=0,bd=1e9;for(let j=0;j<M.n;j++){const d=Math.abs(M.x(j)-px);if(d<bd){bd=d;k=j;}}
    cross.setAttribute('x1',M.x(k));cross.setAttribute('x2',M.x(k));cross.setAttribute('visibility','visible');
    tip.innerHTML=`<b>After GW${M.gws[k]}</b>`+M.data.map((d,i)=>({i,v:d[k]})).sort((a,b)=>b.v-a.v).map(o=>`<div class="row"><span><span class="swatch" style="background:${SERIES[o.i]}"></span>${esc(S.couples[o.i].name)}</span><span>${mns(o.v)}</span></div>`).join('');
    tip.hidden=false;
    const card=svg.parentElement.getBoundingClientRect();
    let left=ev.clientX-card.left+14;if(left+tip.offsetWidth>card.width-6)left=ev.clientX-card.left-tip.offsetWidth-14;
    tip.style.left=Math.max(6,left)+'px';tip.style.top=Math.max(4,ev.clientY-card.top-tip.offsetHeight-12)+'px';
  };
  hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',()=>{tip.hidden=true;cross.setAttribute('visibility','hidden');});
}

/* ---------- transfers (published by FPL once each deadline has passed) ---------- */
function transfersSection(){
  const T=S.transfers; if(!T||!T.players)return '';
  const P=T.players, all=players().filter(p=>P[p]);
  const mv=m=>`<span class="o"><span class="sr">Out: </span>${esc(m.out)}</span>${ICON_AR}<span class="i"><span class="sr">in: </span>${esc(m.in)}</span> <span class="small">${esc(m.inTeam||'')}${m.price!=null?' · £'+(+m.price).toFixed(1)+'m':''}</span>`;
  /* talking points, worked out from the moves themselves */
  const hi=[], bought={}, sold={};
  all.forEach(p=>(P[p].moves||[]).forEach(m=>{const k=m.in+'|'+(m.inTeam||'');(bought[k]=bought[k]||{n:m.in,t:m.inTeam,who:[]}).who.push(p);const s=m.out+'|'+(m.outTeam||'');(sold[s]=sold[s]||{n:m.out,who:[]}).who.push(p);}));
  Object.values(bought).filter(b=>b.who.length>1).forEach(b=>hi.push(`<b>${esc(b.n)}</b> was the week's popular buy: ${esc(listNames(b.who))} both brought him in.`.replace('both',b.who.length>2?'all':'both')));
  Object.entries(bought).forEach(([k,b])=>{const s=sold[k];if(s){const by=b.who, sel=s.who.filter(x=>!by.includes(x));if(sel.length)hi.push(`<b>${esc(b.n)}</b> changed hands: ${esc(listNames(sel))} sold him and ${esc(listNames(by))} bought him.`);}});
  Object.values(sold).filter(s=>s.who.length>1).forEach(s=>hi.push(`<b>${esc(s.n)}</b> was shown the door by ${esc(listNames(s.who))}.`));
  all.filter(p=>+P[p].hit>0).forEach(p=>hi.push(`${esc(p)} took a <b>−${+P[p].hit}</b> points hit.`));
  all.filter(p=>P[p].chip).forEach(p=>hi.push(`${esc(p)} played the <b>${esc(P[p].chip)}</b>.`));
  const still=all.filter(p=>!(P[p].moves||[]).length&&!P[p].chip);
  if(still.length)hi.push(`${esc(listNames(still))} made no transfer${still.length>1?'s':''} and rolled the free transfer.`);
  const n=all.reduce((s,p)=>s+(P[p].moves||[]).length,0);
  let h=`<section id="transfers" aria-labelledby="x-h"><div class="sec-head"><h2 id="x-h">Transfers</h2><span class="muted small">GW${esc(T.gw)} · ${n} move${n===1?'':'s'} before the deadline</span></div>`;
  if(hi.length)h+=`<ul class="trhi">${hi.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  h+=`<div class="trgrid">${S.couples.map((c,i)=>`<div class="trcard" style="--c:${SERIES[i]}"><h3>${esc(c.name)}</h3>${c.players.filter(p=>P[p]).map(p=>{const d=P[p],ms=d.moves||[];return `<div class="trp"><span><b>${esc(p)}</b>${+d.hit>0?` <span class="hit">−${+d.hit} hit</span>`:''}${d.chip?` <span class="chiptag">${esc(d.chip)}</span>`:''}</span>${ms.length?ms.map(m=>`<span class="trm">${mv(m)}</span>`).join(''):`<span class="trm">${d.chip==='Free Hit'||d.chip==='Wildcard'?'Changes not listed':'No transfer'}</span>`}</div>`;}).join('')}</div>`).join('')}</div>`;
  const SE=T.season;
  if(SE){
    const FREE=c=>c==='Wildcard'||c==='Free Hit';
    const rows=players().filter(p=>SE[p]).map(p=>{const r={p,...SE[p]};r.chipN=(r.log||[]).filter(l=>FREE(l.chip)).reduce((s,l)=>s+l.moves.length,0);r.reg=Math.max(0,(+r.count||0)-r.chipN);return r;}).sort((a,b)=>b.reg-a.reg||b.chipN-a.chipN||a.p.localeCompare(b.p));
    h+=`<details id="d-trs"><summary>Season transfers</summary><div class="tablewrap"><table><thead><tr><th class="l">Player · chips played</th><th>Transfers</th><th>Via chips</th><th>Hits</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="l" style="white-space:normal"><span class="swatch" style="background:${SERIES[coupleOf(r.p)]}"></span>${esc(r.p)}<span class="muted small" style="display:block;font-weight:400;padding-left:18px">${(r.chips||[]).length?r.chips.map(c=>esc(c.name)+' (GW'+(+c.gw)+')').join(', '):'No chips yet'}</span></td><td><b>${r.reg}</b></td><td>${r.chipN||'–'}</td><td${+r.hitPts>0?' class="f"':''}>${+r.hitPts>0?'−'+(+r.hitPts):'–'}</td></tr>`).join('')}</tbody></table></div>`;
    h+=`<p class="muted small" style="padding:10px 14px 0">Transfers are ordinary transfers, the ones that can cost a hit. Via chips counts the free changes made in Wildcard and Free Hit weeks; Free Hit changes are reversed the following week.</p>`;
    h+=`<ol class="trlog">${rows.map(r=>`<li><h4>${esc(r.p)}</h4><ul>${(r.log||[]).map(l=>FREE(l.chip)&&l.moves.length>2?`<li><details><summary><b>GW${+l.gw}</b> ${esc(l.chip)} · ${l.moves.length} changes</summary>${l.moves.map(m=>esc(m[0])+' → '+esc(m[1])).join(', ')}</details></li>`:`<li><b>GW${+l.gw}</b>${l.chip?` (${esc(l.chip)})`:''}: ${l.moves.map(m=>esc(m[0])+' → '+esc(m[1])).join(', ')}</li>`).join('')||'<li>No transfers yet.</li>'}</ul></li>`).join('')}</ol></details>`;
  }
  h+=`<p class="muted small">FPL keeps everyone's transfers hidden until the deadline; they appear here once it has passed.</p></section>`;
  return h;
}

/* ---------- season records (facts only) ---------- */
function statsStrip(Z){
  const R=Z.res; if(R.length<3)return '';
  const top=a=>{const m=Math.max(...a.map(x=>x.v));return a.filter(x=>x.v===m);};
  const who=a=>esc(listNames([...new Set(a.map(x=>x.n))]));
  const when=a=>{const g=[...new Set(a.map(x=>x.gw))].sort((x,y)=>x-y);return g.length>2?g.length+' times':g.map(x=>'GW'+x).join(' and ');};
  const cw=top(R.flatMap(({g,a})=>a.tot.map((t,i)=>({v:t,n:S.couples[i].name,gw:g.gw}))));
  const iw=top(R.flatMap(({g})=>players().map(p=>({v:+g.scores[p]||0,n:p,gw:g.gw}))));
  const mg=top(R.map(({g,a})=>{const s=[...a.tot].sort((x,y)=>y-x);return {v:s[0]-s[1],n:S.couples[a.tot.indexOf(s[0])].name,gw:g.gw};}));
  const rn=top(S.couples.map((c,i)=>{let cur=0,st=0,b={v:0,n:c.name};R.forEach(({g,a},k)=>{if(a.losers.includes(i))cur=0;else{if(!cur)st=g.gw;cur++;if(cur>=b.v)b={v:cur,n:c.name,from:st,to:g.gw,on:k===R.length-1};}});return b;}));
  const span=r=>r.from===r.to?'GW'+r.from:'GW'+r.from+'–'+r.to;
  const tiles=[
    [cw[0].v,'Best couple week',who(cw)+' · '+when(cw)],
    [iw[0].v,'Best player week',who(iw)+' · '+when(iw)],
    [mg[0].v>0?'+'+mg[0].v:'–','Biggest margin',mg[0].v>0?who(mg)+' · '+when(mg):'No outright winner yet'],
    [rn[0].v+(rn[0].v===1?' week':' weeks'),'Spoon-free run',who(rn)+(rn.length===1?' · '+span(rn[0])+(rn[0].on?' (ongoing)':''):'')]];
  return `<div class="stats" aria-label="Season records">${tiles.map(t=>`<div><span class="eyebrow">${t[1]}</span><b class="num">${t[0]}</b><span>${t[2]}</span></div>`).join('')}</div>`;
}
function owingRows(list){
  return list.slice().sort((a,b)=>(a.gw||0)-(b.gw||0)).map(o=>`<div class="due"><span><span class="who">${esc(o.p)}</span> <span class="why">· ${o.gw?'GW'+o.gw+' ':''}${o.why==='extra'?'group ruling':o.why==='couple'?'lowest couple':'lowest individual'} · ${gbp(o.amount)}${o.late?' incl. '+gbp(o.late*S.fine)+' late':''}${o.due?' · '+(o.late?'goes up again ':'due by ')+fmtD(o.due):''}</span></span>${paidChip(false)}</div>`).join('');
}

/* ---------- season end ---------- */
function seasonDone(Z){const g=S.gameweeks.find(x=>x.gw===38);return !!(g&&!g.live&&!g.provisional)&&Z.order.length>0;}
function champions(Z){
  const first=Z.order.filter(c=>c.rank===1), lastPts=Math.min(...Z.order.map(c=>c.pts)), spoon=Z.order.filter(c=>c.pts===lastPts&&c.rank!==1);
  const second=Z.order.find(c=>c.rank>1), by=second?first[0].pts-second.pts:0;
  return {first,spoon,by};
}
function champBanner(Z){
  if(!seasonDone(Z))return '';
  const {first,spoon,by}=champions(Z), joint=first.length>1;
  return `<section class="champs" style="--c:${SERIES[first[0].i]}" aria-label="Season champions"><span class="crown">${joint?'Joint champions':'Champions'} · ${esc(S.season)}</span><h2>${esc(listNames(first.map(c=>c.name)))}</h2><p class="muted">${first[0].pts.toLocaleString('en-GB')} points over 38 gameweeks${!joint&&by>0?` · ${by} ahead of ${esc(Z.order.find(c=>c.rank>1).name)}`:''}.${spoon.length?` Season wooden spoon: ${esc(listNames(spoon.map(c=>c.name)))}.`:''}</p></section>`;
}
function honours(Z){
  const past=(S.honours||[]).slice();
  if(seasonDone(Z)&&!past.some(x=>x.season===S.season)){const {first,spoon}=champions(Z);past.push({season:S.season,champions:listNames(first.map(c=>c.name)),spoon:listNames(spoon.map(c=>c.name))});}
  if(!past.length)return '';
  past.sort((a,b)=>String(b.season).localeCompare(String(a.season)));
  return `<section class="ref" id="honours" aria-labelledby="h-h"><div class="sec-head"><h2 id="h-h">Roll of honour</h2></div><div class="tablewrap"><table><thead><tr><th class="l">Season</th><th class="l">Champions</th><th class="l">Wooden spoon</th></tr></thead><tbody>${past.map(x=>`<tr><td class="l">${esc(x.season)}</td><td class="l" style="white-space:normal">${esc(x.champions||'')}</td><td class="l" style="white-space:normal;font-weight:400">${esc(x.spoon||'–')}</td></tr>`).join('')}</tbody></table></div></section>`;
}

    rows.forEach(r=>{
      const low=a.losers.includes(r.i), top=a.top.includes(r.i)&&!low;
      h+=`<li class="bar-row${low?' low':''}" style="--c:${SERIES[r.i]}"><span class="rk">${r.rank}</span><span class="cn">${esc(r.c.name)}${low?'<span class="spoon">Wooden spoon</span>':''}${top?'<span class="crown">Top couple</span>':''}</span><span class="tt">${r.t}</span><div class="track" aria-hidden="true"><div class="fill" style="width:${(r.t/max*100).toFixed(1)}%"></div></div><span class="split">${r.c.players.map(p=>esc(p)+' '+g.scores[p]).join(' · ')}</span></li>`;
    });
    h+='</ol>';
    const lowT=a.low, above=a.tot.filter(x=>x>lowT);
    if(a.tieLow&&a.losers.length<a.tieLow.length){const w=a.tieLow.filter(i=>!a.losers.includes(i));h+=`<p class="margin">Tied on ${lowT} points. ${esc(listNames(a.losers.map(i=>S.couples[i].name)))} lost on bench points (${a.losers.map(i=>a.bench[i]).join(', ')} v ${w.map(i=>a.bench[i]).join(', ')}).</p>`;}
    else if(above.length&&a.losers.length===1){const next=Math.min(...above),ni=a.tot.indexOf(next);const m=next-lowT;h+=`<p class="margin">${esc(S.couples[a.losers[0]].name)} finished ${m} point${m===1?'':'s'} behind ${esc(S.couples[ni].name)}.</p>`;}
    else if(a.losers.length>1)h+=`<p class="margin">A tie at the bottom${a.hasBench?', level on bench points too,':''} so ${a.losers.length===2?'both':'all'} couples pay.</p>`;
    h+='<div class="dues"><div class="eyebrow">Fines for GW'+g.gw+' · '+gbp(a.fines.reduce((s,f)=>s+f.amount,0))+'</div>';
    a.fines.forEach(f=>{h+=`<div class="due"><span><span class="who">${esc(f.p)}</span> <span class="why">· ${f.why==='couple'?'lowest couple':'lowest individual, '+g.scores[f.p]+' pts'+(a.indivTie?', fewer bench points':'')} · ${gbp(f.amount)}${f.late?' incl. '+gbp(f.late*S.fine)+' late':''}${f.due?(f.late?' · goes up again ':' · due by ')+fmtD(f.due):''}</span></span>${paidChip(f.paid)}</div>`;});
    if(!a.indiv.length)h+=`<div class="due"><span class="why">No extra individual fine. The lowest scorer was already in the losing couple.</span></div>`;
    const other=Z.outstanding.filter(o=>o.why==='extra'||o.gw!==g.gw);
    if(other.length)h+=`<div class="eyebrow" style="margin-top:12px">Still unpaid from earlier</div>`+owingRows(other);
    else if(a.fines.every(f=>f.paid))h+=`<div class="due"><span class="why">Every fine so far is paid.</span></div>`;
    h+='</div></section>';
  }

  h+=`<section id="table" aria-labelledby="t-h"><div class="sec-head"><h2 id="t-h">Season table</h2><span class="muted small">after ${Z.res.length} gameweek${Z.res.length===1?'':'s'}</span></div><div class="tablewrap"><table><thead><tr><th>#</th><th class="l">Couple</th><th>Pts</th><th class="wide-only">Avg</th><th>Wins</th><th>Spoons</th><th class="wide-only">Fines</th></tr></thead><tbody>`;
  Z.order.forEach(c=>{h+=`<tr><td class="pos">${c.rank}</td><td class="l"><span class="swatch" style="background:${SERIES[c.i]}"></span>${esc(c.name)}</td><td><b>${c.pts}</b></td><td class="wide-only">${c.avg.toFixed(1)}</td><td>${c.wins}</td><td>${c.spoons}</td><td class="wide-only">${gbp(c.owed)}</td></tr>`;});
  h+=`</tbody></table></div>${statsStrip(Z)?'<div class="eyebrow" style="margin:6px 0 -4px">Season records</div>'+statsStrip(Z):''}</section>`;
  h+=`<section aria-labelledby="p-h"><div class="sec-head"><h2 id="p-h">Player table</h2><span class="muted small">after ${Z.res.length} gameweek${Z.res.length===1?'':'s'}</span></div><div class="tablewrap"><table><thead><tr><th>#</th><th class="l">Player</th><th>Pts</th><th class="wide-only">Avg</th><th>Lowest</th></tr></thead><tbody>`;
  Z.pl.forEach(r=>{h+=`<tr><td class="pos">${r.rank}</td><td class="l"><span class="swatch" style="background:${SERIES[coupleOf(r.p)]}"></span>${esc(r.p)}</td><td><b>${r.pts}</b></td><td class="wide-only">${Z.res.length?(r.pts/Z.res.length).toFixed(1):'–'}</td><td>${r.low}</td></tr>`;});
  h+=`</tbody></table></div><p class="muted small">Lowest counts the weeks each player had the lowest score of all six.</p></section>`;

  h+=`<section aria-labelledby="c-h"><div class="sec-head"><h2 id="c-h">The race</h2><div class="seg" role="group" aria-label="Chart view"><button id="v-total" aria-pressed="${view==='total'}">Running total</button><button id="v-gap" aria-pressed="${view==='gap'}">Gap to leader</button></div></div>`;
  h+=`<div class="chartcard">${chartSVG(Z)}<div class="tip" id="tip" hidden></div></div>`;
  h+=`<p class="muted small">${view==='total'?'Points piled up week by week. Switch to “Gap to leader” to see how far behind each couple is.':'How many points each couple trails the leader by after each gameweek. The leader sits on zero.'}</p></section>`;

  h+=transfersSection();

  const tOwed=Object.values(Z.per).reduce((a,v)=>a+v.owed,0), tPaid=Object.values(Z.per).reduce((a,v)=>a+v.paid,0);
    const CB=(S.contributions||[]),cTot=CB.reduce((s,c)=>s+(+c.amount||0),0);
  h+=`<section id="pot" aria-labelledby="k-h"><div class="sec-head"><h2 id="k-h">The pot</h2><span class="muted small">${gbp(tOwed)} in fines so far</span></div><div class="kitty" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><span class="eyebrow">In the pot</span><b class="num">${gbp(tPaid+cTot)}</b></div><div><span class="eyebrow">Still owed</span><b class="num" style="color:${tOwed-tPaid>0?'var(--fine)':'var(--ink)'}">${gbp(tOwed-tPaid)}</b></div></div>`;
  if(CB.length)h+=`<p class="muted small">Includes <b>${gbp(cTot)}</b> in extra contributions (money sent to the wrong account and moved into the pot).</p>`;
  const T={couple:[0,0],individual:[0,0],late:[0,0],extra:[0,0]};
  Z.res.forEach(({a})=>a.fines.forEach(f=>{T[f.why][0]++;T[f.why][1]+=S.fine;if(f.late){T.late[0]+=f.late;T.late[1]+=f.late*S.fine;}}));
  Z.extras.forEach(x=>{T.extra[0]++;T.extra[1]+=x.amount;});
  h+=`<details id="d-types"><summary>Fines by type</summary><div class="tablewrap"><table><thead><tr><th class="l">Type of fine</th><th>Number</th><th>Total</th></tr></thead><tbody>${[['couple','Lowest couple'],['individual','Lowest individual'],['late','Late payment'],['extra','Group rulings']].map(([k,l])=>`<tr><td class="l">${l}</td><td>${T[k][0]}</td><td>${gbp(T[k][1])}</td></tr>`).join('')}</tbody></table></div></details>`;
  const anyOwe=players().some(p=>Z.per[p].owed>Z.per[p].paid);
  h+=`<div class="tablewrap"><table><thead><tr><th class="l">Player</th><th>Fines</th><th>Total</th>${anyOwe?'<th>Owing</th>':''}</tr></thead><tbody>`;
  players().map(p=>({p,...Z.per[p]})).sort((a,b)=>b.owed-a.owed||a.p.localeCompare(b.p)).forEach(r=>{
    h+=`<tr><td class="l"><span class="swatch" style="background:${SERIES[coupleOf(r.p)]}"></span>${esc(r.p)}</td><td>${r.n}</td><td>${gbp(r.owed)}</td>${anyOwe?`<td${r.owed>r.paid?' class="f"':''}>${r.owed>r.paid?gbp(r.owed-r.paid):'–'}</td>`:''}</tr>`;});
  h+=`</tbody></table></div>`;
  const allF=[];Z.res.forEach(({g,a})=>a.fines.forEach(f=>allF.push({gw:g.gw,p:f.p,why:(f.why==='couple'?'Lowest couple':'Lowest individual')+(f.late?' + '+f.late+' late':''),amount:f.amount,paid:f.paid})));Z.extras.forEach(x=>allF.push({gw:x.gw,p:x.player,why:'Group ruling: '+(x.reason||''),amount:x.amount,paid:x.paid}));allF.sort((a,b)=>(b.gw||0)-(a.gw||0));
  h+=`<details id="d-fines"><summary>Every fine so far (${allF.length})</summary><div class="tablewrap"><table><thead><tr><th>GW</th><th class="l">Who</th><th class="l">Why</th><th>Amount</th><th></th></tr></thead><tbody>`;
  allF.forEach(f=>{h+=`<tr><td>${f.gw?'GW'+f.gw:'–'}</td><td class="l">${esc(f.p)}</td><td class="l" style="font-weight:400;white-space:normal">${esc(f.why)}</td><td>${gbp(f.amount)}</td><td>${paidChip(f.paid)}</td></tr>`;});
  h+='</tbody></table></div></details></section>';

  const gv=gview||(window.innerWidth<700?'couples':'players'), PV=gv==='players';
  h+=`<section class="ref" aria-labelledby="w-h"><div class="sec-head"><h2 id="w-h">Every gameweek</h2><div class="seg sm" role="group" aria-label="Table view"><button id="g-c" aria-pressed="${!PV}">Couples</button><button id="g-p" aria-pressed="${PV}">Players</button></div></div>`;
  h+=`<p class="muted small">${PV?'<span class="mark" style="margin:0">F</span> fined · ':''}<span style="color:var(--fine);font-weight:600">Red</span> lowest couple${Z.res.some(r=>r.g.provisional)?' · * provisional':''}</p><div class="tablewrap sticky"><table><thead><tr><th>GW</th>`;
  S.couples.forEach((c,i)=>{if(PV)c.players.forEach(p=>h+=`<th>${esc(p)}</th>`);h+=`<th>${PV?'':`<span class="swatch" style="background:${SERIES[i]}"></span>`}<span aria-label="${esc(c.name)}">${esc(c.players.map(w=>w[0]).join('+'))}</span></th>`;});
  h+='</tr></thead><tbody>';
  [...Z.res].reverse().forEach(({g,a})=>{h+=`<tr><td>GW${g.gw}${g.provisional?'*':''}</td>`;S.couples.forEach((c,i)=>{if(PV)c.players.forEach(p=>{h+=`<td>${g.scores[p]}${a.fines.some(x=>x.p===p)?'<span class="mark">F</span>':''}</td>`;});h+=`<td${a.losers.includes(i)?' class="lowcell"':' style="font-weight:600"'}>${a.tot[i]}</td>`;});h+='</tr>';});
  h+=`</tbody></table></div>${PV?'<p class="swipe muted small">Swipe the table sideways to see every player.</p>':''}</section>`;

  h+=honours(Z);

  const RU=S.rules, md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b class="em">$1</b>');
  if(RU){
    h+=`<section class="rulesec ref" id="rules" aria-labelledby="r-h"><div class="sec-head"><h2 id="r-h">House rules</h2><span class="muted small">Version ${esc(RU.version)} · in force from ${esc(RU.date)}</span></div>`;
    if((RU.glance||[]).length)h+=`<div class="glance" aria-label="The rules at a glance">${RU.glance.map(g=>`<div><b>${esc(g.big)}</b><span>${md(g.text)}</span></div>`).join('')}</div>`;
    h+=`<details id="d-rules" class="rulebook-d"><summary>Full rules · ${RU.sections.length} sections</summary><div class="rulebook">${RU.sections.map((s,i)=>`<div class="rs"><h3><span class="sn">${i+1}</span>${esc(s.title)}</h3><ol>${s.items.map((t,j)=>`<li><span class="rn">${i+1}.${j+1}</span><span>${md(t)}</span></li>`).join('')}</ol></div>`).join('')}</div></details>`;
    const CH=RU.changes||[];
    if(CH.length)h+=`<details id="d-changes"><summary>Rule changes (${CH.length} versions)</summary><ol class="changes">${CH.map(c=>`<li><div><span class="chip gold">Version ${esc(c.version)}</span> <span class="small">${esc(c.date)}</span></div>${Array.isArray(c.items)?`<ul>${c.items.map(x=>`<li>${md(x)}</li>`).join('')}</ul>`:`<p>${md(c.summary||'')}</p>`}</li>`).join('')}</ol></details>`;
    h+='</section>';
  }

  h+=`<footer>${S.league?esc(S.league)+' league · ':''}Scores from the official Fantasy Premier League game.${S.gameweeks.some(g=>g.provisional)?' * Provisional until bonus points are added.':''} Last updated ${esc(fmtUpd())}.</footer>`;
  const NAV=[['week','This week'],['table','Table'],['transfers','Transfers'],['pot','Pot'],['rules','Rules']].filter(([id])=>h.includes(`id="${id}"`));
  h=h.replace('<!--NAV-->',`<nav class="jump" aria-label="Sections">${NAV.map(([id,l])=>`<a href="#${id}"><span>${l}</span></a>`).join('')}</nav>`);
  app.innerHTML=h;
  openD.forEach(id=>{const d=document.getElementById(id);if(d)d.open=true;});
  wire(Z);
}

/* ---------- interactions ---------- */
function wire(Z){
  wireChart();
  $('#v-total').onclick=()=>{view='total';render();};
  $('#v-gap').onclick=()=>{view='gap';render();};
  const gc=$('#g-c'),gp=$('#g-p');
  if(gc)gc.onclick=()=>{gview='couples';render();};
  if(gp)gp.onclick=()=>{gview='players';render();};
  navSync();
  const jn=$('.jump');if(jn){const fade=()=>jn.classList.toggle('more',jn.scrollLeft+jn.clientWidth<jn.scrollWidth-2);jn.addEventListener('scroll',fade,{passive:true});fade();}
}
/* Highlight the section in view in the jump bar */
let navCur=null,navTick=false;
function navSync(){
  const links=[...document.querySelectorAll('.jump a')]; if(!links.length)return;
  let cur=links[0];
  links.forEach(a=>{const el=document.getElementById(a.hash.slice(1));if(el&&el.getBoundingClientRect().top<=96)cur=a;});
  if((window.innerHeight+window.scrollY)>=document.documentElement.scrollHeight-4)cur=links[links.length-1];
  links.forEach(a=>a===cur?a.setAttribute('aria-current','location'):a.removeAttribute('aria-current'));
  if(cur.hash!==navCur){navCur=cur.hash;const n=cur.parentElement;if(cur.offsetLeft<n.scrollLeft||cur.offsetLeft+cur.offsetWidth>n.scrollLeft+n.clientWidth)n.scrollLeft=Math.max(0,cur.offsetLeft-16);}
}
window.addEventListener('scroll',()=>{if(navTick)return;navTick=true;requestAnimationFrame(()=>{navTick=false;navSync();});},{passive:true});


render();
let rz,lastW=window.innerWidth;
window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(Math.abs(window.innerWidth-lastW)<40)return;lastW=window.innerWidth;const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='SELECT'))return;render();},200);});
})();
</script>
</body></html>
